name: Release

on:
  push:
    branches: [main, 'release/*']

jobs:
  release:
    uses: calavia-org/workflows-lib/.github/workflows/release-github-action.yml@v0
    with:
      default-bump: patch
      release-branches: main,release/**
      validate-action: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
