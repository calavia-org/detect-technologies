name: 'Detect Technologies'
description: 'Detects buildable technologies in a repository based on file indicators'
inputs:
  fail-on-missing:
    description: 'Fail if no technologies detected'
    required: false
    default: 'false'
outputs:
  technologies:
    description: 'Comma-separated list of detected technologies'
    value: ${{ steps.detect.outputs.technologies }}
  count:
    description: 'Number of technologies detected'
    value: ${{ steps.detect.outputs.count }}
  python:
    description: 'Path to Python indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.python }}
  go:
    description: 'Path to Go indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.go }}
  rust:
    description: 'Path to Rust indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.rust }}
  java:
    description: 'Path to Java indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.java }}
  ansible-collection:
    description: 'Path to Ansible collection indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.ansible-collection }}
  container:
    description: 'Path to Container indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.container }}
  ansible-execution-environment:
    description: 'Path to Ansible EE indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.ansible-execution-environment }}
  helm:
    description: 'Path to Helm indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.helm }}
runs:
  using: composite
  steps:
    - name: Detect technologies
      id: detect
      shell: bash
      run: |
        TECHS=""
        COUNT=0
        PYTHON=""
        GO=""
        RUST=""
        JAVA=""
        ANSIBLE_COLLECTION=""
        CONTAINER=""
        ANSIBLE_EE=""
        HELM=""
        
        # Python detection
        if [ -f "pyproject.toml" ]; then
          PYTHON="pyproject.toml"
        elif [ -f "setup.py" ]; then
          PYTHON="setup.py"
        elif [ -f "setup.cfg" ]; then
          PYTHON="setup.cfg"
        elif [ -f "requirements.txt" ]; then
          PYTHON="requirements.txt"
        elif [ -f "Pipfile" ]; then
          PYTHON="Pipfile"
        fi
        
        if [ -n "$PYTHON" ]; then
          TECHS="python,${TECHS}"
          COUNT=$((COUNT + 1))
        fi
        
        # Go detection
        if [ -f "go.mod" ]; then
          GO="go.mod"
          TECHS="go,${TECHS}"
          COUNT=$((COUNT + 1))
        fi
        
        # Rust detection
        if [ -f "Cargo.toml" ]; then
          RUST="Cargo.toml"
          TECHS="rust,${TECHS}"
          COUNT=$((COUNT + 1))
        fi
        
        # Java detection
        if [ -f "pom.xml" ]; then
          JAVA="pom.xml"
        elif [ -f "build.gradle" ]; then
          JAVA="build.gradle"
        elif [ -f "build.gradle.kts" ]; then
          JAVA="build.gradle.kts"
        fi
        
        if [ -n "$JAVA" ]; then
          TECHS="java,${TECHS}"
          COUNT=$((COUNT + 1))
        fi
        
        # Ansible Collection detection
        if [ -f "galaxy.yml" ]; then
          if grep -q "type: collection" galaxy.yml 2>/dev/null; then
            ANSIBLE_COLLECTION="galaxy.yml"
            TECHS="ansible-collection,${TECHS}"
            COUNT=$((COUNT + 1))
          fi
        fi
        
        # Container detection (Dockerfile or Containerfile)
        if [ -f "Dockerfile" ]; then
          CONTAINER="Dockerfile"
        elif [ -f "Containerfile" ]; then
          CONTAINER="Containerfile"
        fi
        
        if [ -n "$CONTAINER" ]; then
          TECHS="container,${TECHS}"
          COUNT=$((COUNT + 1))
        fi
        
        # Ansible Execution Environment detection
        if [ -f "execution-environment.yml" ]; then
          ANSIBLE_EE="execution-environment.yml"
        elif [ -f "execution-environment.yaml" ]; then
          ANSIBLE_EE="execution-environment.yaml"
        fi
        
        if [ -n "$ANSIBLE_EE" ]; then
          TECHS="ansible-execution-environment,${TECHS}"
          COUNT=$((COUNT + 1))
        fi
        
        # Helm detection - find Chart.yml anywhere in the repo
        HELM=$(find . -name "Chart.yml" -type f 2>/dev/null | head -1 | sed 's|^\./||')
        
        if [ -n "$HELM" ]; then
          TECHS="helm,${TECHS}"
          COUNT=$((COUNT + 1))
        fi
        
        # Remove trailing comma
        TECHS=$(echo "$TECHS" | sed 's/,$//')
        
        # Set outputs
        echo "technologies=$TECHS" >> "$GITHUB_OUTPUT"
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "python=$PYTHON" >> "$GITHUB_OUTPUT"
        echo "go=$GO" >> "$GITHUB_OUTPUT"
        echo "rust=$RUST" >> "$GITHUB_OUTPUT"
        echo "java=$JAVA" >> "$GITHUB_OUTPUT"
        echo "ansible-collection=$ANSIBLE_COLLECTION" >> "$GITHUB_OUTPUT"
        echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
        echo "ansible-execution-environment=$ANSIBLE_EE" >> "$GITHUB_OUTPUT"
        echo "helm=$HELM" >> "$GITHUB_OUTPUT"
        
        # Summary
        echo "Detected $COUNT technology(ies): $TECHS"
        
        # Fail if requested and nothing detected
        if [ "$COUNT" -eq 0 ] && [ "${{ inputs.fail-on-missing }}" == "true" ]; then
          echo "No technologies detected"
          exit 1
        fi
